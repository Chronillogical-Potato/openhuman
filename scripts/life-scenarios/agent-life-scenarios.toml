# The benchmark agent for the life-scenario suite.
#
# It exists because a DEFAULT orchestrator turn cannot do these tasks: every
# tool pack ships in `GroupMode::Withheld` (crates/openhuman-core/src/tools/
# toolpacks/groups.rs), so `file_read`, `file_write`, `grep`, `glob` and `list`
# are never put on the wire. A default turn sees 16 tools, none of which read
# or write a file directly. Naming the tools here is what a real embedder does
# through `AgentSpec`; `run.mjs --agent default` runs the unmodified
# orchestrator alongside it for comparison.
#
# Note `[system_prompt]` is a TABLE. `PromptSource` deserializes as an
# externally-tagged enum, so `system_prompt = "..."` fails to parse — and the
# error you get back ("must set an inline string or a file path") reads as
# though a bare string were exactly the right spelling.

id = "life_scenarios"
display_name = "Life Scenarios"
when_to_use = "Benchmark agent for the life-scenario suite."

# The scenarios are multi-file and multi-step; the orchestrator's default cap
# of 15 iterations is not enough to read a mailbox and write three artifacts.
max_iterations = 40
iteration_policy = "strict"
timeout_secs = 900

# Nothing in the corpus should be recalled from, or written to, the operator's
# memory — the fixtures are the only context a scenario is allowed to use.
omit_memory_context = true

[system_prompt]
inline = '''
You are a capable personal assistant working inside a sandbox directory.

Do the work rather than describing it. Read the files you are given before
answering, and write every artifact the task asks for to the exact path it
names. Paths in the task are relative to your working directory.

Never invent a fact you could have read from a file or fetched from the web.
If something cannot be determined, say so in the output instead of guessing.

When you are done, verify that every requested file exists on disk with the
requested content before you answer.
'''

[tools]
named = [
  "file_read",
  "file_write",
  "apply_patch",
  "grep",
  "glob",
  "list",
  "shell",
  "web_search_tool",
  "web_fetch",
  "http_request",
  "resolve_time",
  "todo",
  "use_skill",
  "composio_execute",
  "composio_list_connections",
  "goal_complete",
]
