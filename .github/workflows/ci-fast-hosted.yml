---
# CI Fast (hosted) — PRs from outside the tinyhumansai org run the same lane
# flow as ci-fast.yml, split across GitHub-hosted runners and cached with
# GitHub's Actions cache. The EX63 runners never run this code: their runner
# group only admits ci-fast.yml / ci-lanes.yml at refs/heads/main, and a fork's
# `pull_request` run resolves to refs/pull/N/merge.
#
# Org members skip this workflow; ci-fast.yml runs theirs on the EX63.
name: CI Fast (hosted)

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-fast-hosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: Route (outsiders → GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      outsider: ${{ steps.route.outputs.outsider }}
    steps:
      - name: Decide whether the author is an outside contributor
        id: route
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          # Fork `pull_request` runs get no secrets, so this can only read the
          # event's author association. Mirrors ci-fast.yml's no-token path:
          # a run is a member run only when the author is OWNER/MEMBER and the
          # pusher is the author.
          outsider=true
          if { [ "${ASSOCIATION}" = "OWNER" ] || [ "${ASSOCIATION}" = "MEMBER" ]; } && [ "${ACTOR}" = "${AUTHOR}" ]; then
            outsider=false
          fi
          echo "[ci][route] author=${AUTHOR} actor=${ACTOR} association=${ASSOCIATION} outsider=${outsider}"
          echo "outsider=${outsider}" >> "$GITHUB_OUTPUT"

  lanes:
    name: Lanes
    needs: route
    if: needs.route.outputs.outsider == 'true'
    uses: ./.github/workflows/ci-lanes.yml
    with:
      profile: hosted
      pr-number: ${{ github.event.pull_request.number }}
      base-ref: ${{ github.base_ref }}
