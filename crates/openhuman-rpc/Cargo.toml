[package]
name = "openhuman-rpc"
description = "OpenHuman's JSON-RPC protocol: envelopes, the HTTP client, and the core's JSON-RPC server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["http-client", "server"]
# Authenticated HTTP client for reaching a core's `/rpc` endpoint.
http-client = ["dep:reqwest"]
# The core's JSON-RPC server: HTTP router, Socket.IO, and the listener bind.
# Turns on the core's `http-server` gate, which carries the domain-owned HTTP
# handlers (the `/v1` inference router, the dictation WebSocket) the router
# mounts.
server = [
    "openhuman-core/http-server",
    "dep:axum",
    "dep:socketioxide",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:futures",
    "dep:tracing",
    "dep:chrono",
    "dep:anyhow",
    "dep:once_cell",
    "dep:tinyinference-core",
    "dep:base64",
    "dep:rand",
    "dep:uuid",
    "dep:urlencoding",
    "dep:openhuman-store-sqlite",
]
# Forwarded so the server's Sentry-routing tests run against a core that
# reports to Sentry.
crash-reporting = ["openhuman-core/crash-reporting"]

[dependencies]
openhuman-core = { path = "../openhuman-core", package = "openhuman", default-features = false }
# The on-disk session store the app and CLI install (`install_session_store`).
openhuman-store-sqlite = { workspace = true, optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
socketioxide = { version = "0.15", features = ["extensions"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1.18", default-features = false, features = ["sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt", "io"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
anyhow = { version = "1.0", optional = true }
once_cell = { version = "1.19", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
urlencoding = { version = "2.1", optional = true }
tinyinference-core = { path = "../../vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core", optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sentry = { version = "0.47.0", default-features = false, features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
