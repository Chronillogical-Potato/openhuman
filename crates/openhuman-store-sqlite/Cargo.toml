[package]
name = "openhuman-store-sqlite"
description = "The desktop session store: OpenHuman's on-disk transcript, run-ledger and turn-state layout behind the TinyAgents session store port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Deliberately free of the core: this crate only wraps TinyAgents' file and
# SQLite building blocks behind `SessionStoreProvider`, so the core and embed
# stay storage-agnostic and a host chooses this layout by installing it.
[dependencies]
anyhow = "1"
chrono = "0.4"
log = "0.4"
tinyagents-harness = { path = "../../vendor/tinyagents/crates/tinyagents-harness", default-features = false }
tinyagents-session = { path = "../../vendor/tinyagents/crates/tinyagents-session" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
