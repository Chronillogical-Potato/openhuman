[package]
name = "openhuman-tinyhumans"
description = "OpenHuman embed runtime wired to the hosted TinyHumans backend through the tinyhumans-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

# Every gate forwards 1:1 to `openhuman-embed`, which forwards it to the core.
# This crate adds no gates of its own: it is the layer that *connects* an
# embed runtime to the TinyHumans backend, not a feature surface.
[features]
default = ["openhuman-embed/default"]
http-server = ["openhuman-embed/http-server"]
inference = ["openhuman-embed/inference"]
documents = ["openhuman-embed/documents"]
hosting = ["openhuman-embed/hosting"]
modules = ["openhuman-embed/modules"]
voice = ["openhuman-embed/voice"]
web3 = ["openhuman-embed/web3"]
runtime-node = ["openhuman-embed/runtime-node"]
contacts = ["openhuman-embed/contacts"]
media = ["openhuman-embed/media"]
flows = ["openhuman-embed/flows"]
skills = ["openhuman-embed/skills"]
mcp = ["openhuman-embed/mcp"]
crash-reporting = ["openhuman-embed/crash-reporting"]
medulla = ["openhuman-embed/medulla"]
channels = ["openhuman-embed/channels"]
sandbox-landlock = ["openhuman-embed/sandbox-landlock"]
sandbox-bubblewrap = ["openhuman-embed/sandbox-bubblewrap"]
peripheral-rpi = ["openhuman-embed/peripheral-rpi"]
browser-native = ["openhuman-embed/browser-native"]
whatsapp-web = ["openhuman-embed/whatsapp-web"]
file-logging = ["openhuman-embed/file-logging"]
scheduler-gate = ["openhuman-embed/scheduler-gate"]

[dependencies]
openhuman-embed = { path = "../openhuman-embed", default-features = false }
# Direct access to `api::transport` / `core::all` — the surfaces embed does
# not (and should not) re-export. Features unify with embed's forwarding.
openhuman-core = { path = "../openhuman-core", package = "openhuman", default-features = false }
# The vendored TinyHumans SDK: the only crate in the tree that may depend on
# it. `default-features = false` drops the Socket.IO client; realtime stays
# on the core's own `platform::socket` transport.
tinyhumans-sdk = { path = "../../vendor/tinyhumans-sdk", default-features = false }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
